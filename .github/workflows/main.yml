name: Run adobe.py every day

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * 0"   # every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  run-pin-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # ensure GITHUB_TOKEN is used for push (default)

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Download adobe.zip from Google Drive
        shell: powershell
        run: |
          $url = '${{ secrets.GDRIVE_ADOBE_URL }}'
          $output = 'adobe.zip'
          Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
          if (-not (Test-Path $output)) {
            throw "Download failed: $output not found."
          }

      - name: Unzip adobe.zip
        shell: powershell
        run: |
          Expand-Archive -Path adobe.zip -DestinationPath . -Force
          Remove-Item adobe.zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install webdriver-manager

      - name: Auto-update Google Chrome
        shell: powershell
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          choco upgrade googlechrome -y --ignore-checksums

      - name: Run generate_image.py
        run: python generate_image.py
